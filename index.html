<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List - Week 7</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <main class="container">
        <h1>My To-Do List</h1>
        <p><a href="cart/">🛒 Open Shopping Cart</a></p>
        <form id="todo-form">
            <input id="todo-input" type="text" placeholder="Add a new task..." required />
            <button type="submit">Add</button>
        </form>

        <div class="filters">
            <button data-filter="all" class="filter-btn active">All</button>
            <button data-filter="active" class="filter-btn">Active</button>
            <button data-filter="completed" class="filter-btn">Completed</button>
        </div>

        <ul id="todo-list"></ul>
        <p id="todo-count"></p>
        <button id="clear-completed">Clear Completed</button>
    </main>
    <script type="module" src="js/app.js"></script>
</body>
</html>
